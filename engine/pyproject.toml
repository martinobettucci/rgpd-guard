# @spec docs/BACKLOG.md#RG-002 | docs/BACKLOG.md#RG-007 | docs/BACKLOG.md#RG-008 | docs/BACKLOG.md#RG-009 | docs/DAT.md#dependances
[project]
name = "rgpd-guard-engine"
version = "0.1.0"
description = "Moteur local (CPU) de détection et de pseudonymisation des données personnelles pour Claude Code"
license = "MIT"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi>=0.115",
  "uvicorn>=0.30",
  "pydantic>=2.7",
  "pydantic-settings>=2.3",
  "python-stdnum>=1.20",
  "phonenumbers>=8.13",
  "pyyaml>=6.0",
]

[project.optional-dependencies]
# Détecteurs à modèles, exécutés sur CPU uniquement (torch via l'index CPU de PyTorch).
# Pipelines spaCy publiés par Explosion pour spaCy 3.8 (le Hub Hugging Face n'expose que les versions 3.7) :
# roues épinglées par URL et empreinte dans uv.lock, installées dans l'environnement virtuel donc lues hors ligne.
nlp = ["spacy>=3.8,<3.9", "fr-core-news-md==3.8.0", "en-core-web-md==3.8.0"]
laya = ["laya>=0.3.20", "torch>=2.4"]
gliner = ["gliner>=0.2.20", "torch>=2.4", "sentencepiece>=0.2", "protobuf>=4.25"]

[dependency-groups]
dev = [
  "pytest>=8.2",
  "httpx>=0.27",
  "ruff>=0.6",
  "mypy>=1.10",
  "types-pyyaml>=6.0",
  "faker>=26.0",
]

[tool.uv.sources]
torch = [{ index = "pytorch-cpu" }]
fr-core-news-md = { url = "https://github.com/explosion/spacy-models/releases/download/fr_core_news_md-3.8.0/fr_core_news_md-3.8.0-py3-none-any.whl" }
en-core-web-md = { url = "https://github.com/explosion/spacy-models/releases/download/en_core_web_md-3.8.0/en_core_web_md-3.8.0-py3-none-any.whl" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["rgpd_guard"]

[tool.ruff]
line-length = 120
target-version = "py312"
src = [".", "tests", "../e2e/claude"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "N"]
ignore = ["S101", "E501"]  # longueur gérée par le formateur ; les en-têtes @spec peuvent dépasser

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S105", "S106", "S311"]
"../e2e/**" = ["S105", "S106", "S311", "S603", "S607"]

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true
packages = ["rgpd_guard"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = [
  "models: tests nécessitant les modèles CPU téléchargés (spaCy, Laya, GLiNER)",
]
