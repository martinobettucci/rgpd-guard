# @spec docs/BACKLOG.md#RG-018 | docs/DAT.md#securite
# Tableau de bord en production : fichiers statiques, en-têtes de sécurité, relais /api vers le moteur.
server {
    listen 8080;
    server_tokens off;
    root /usr/share/nginx/html;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; style-src 'self'; script-src 'self'; connect-src 'self'; frame-ancestors 'none'; base-uri 'none'; form-action 'self'" always;

    location /api/ {
        proxy_pass http://engine:8742/;
        proxy_set_header Host $host;
        proxy_read_timeout 120s;
        client_max_body_size 4m;
    }

    location / {
        try_files $uri /index.html;
    }
}
